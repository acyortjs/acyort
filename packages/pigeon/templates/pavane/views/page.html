{% extends 'partial/base.html' %}

{% block title %}
{{ config.title }} / {{ page.title }}
{% endblock %}

{% block heading %}
{{ page.title }}
{% endblock %}

{% block content %}
<div class="markdown-body">
{{ page.content }}
</div>

<div class="source">
  <a target="_blank" href="https://github.com/{{ config.repository }}/issues/{{ page.number }}">Source</a>
</div>

{% endblock %}
